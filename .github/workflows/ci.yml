name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # src/data/items.json 是构建产物（不入库），类型检查前必须先生成
      - name: Generate data
        run: npm run data
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
