appId: com.zhipingwoods.figtx
productName: FigTX
copyright: Copyright © 2026 ZhipingWoods

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: "FigTX-${version}-${arch}.${ext}"
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: "FigTX-Setup-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: FigTX

linux:
  target:
    - AppImage
    - deb
  category: Graphics
  icon: build/icon-512.png
  maintainer: ZhipingWoods
  artifactName: "FigTX-${version}-${arch}.${ext}"

publish:
  provider: github
  releaseType: release
